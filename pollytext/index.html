<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pollinations Arena</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap');

        :root {
            --bg-base: #030712;
            --bg-panel: #0f172a;
            --bg-card: rgba(15, 23, 42, 0.7);
            --bg-input: #020617;
            --border-color: rgba(255, 255, 255, 0.1);
            --brand-primary: #8b5cf6;
            --brand-hover: #a78bfa;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-emerald: #10b981;
            --accent-rose: #f43f5e;
            --accent-blue: #3b82f6;
            --font-sans: 'Inter', sans-serif;
            --font-mono: 'Fira Code', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .hidden { display: none !important; }

        /* Background Animated Blobs */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
            animation: float 20s infinite alternate ease-in-out;
        }
        .blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: var(--brand-primary); animation-delay: 0s; }
        .blob-2 { bottom: -20%; right: -10%; width: 60vw; height: 60vw; background: var(--accent-blue); animation-delay: -5s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(10%, 10%) scale(1.1); }
        }

        /* Floating Settings Action Button */
        .fab-settings {
            position: fixed;
            top: 1rem;
            right: 1rem;
            width: 2.75rem;
            height: 2.75rem;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            font-size: 1.1rem;
            cursor: pointer;
            z-index: 50;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: all 0.2s;
        }
        .fab-settings:hover { background: var(--brand-primary); border-color: var(--brand-hover); }

        /* Main Carousel layout */
        .arena-carousel {
            display: flex;
            gap: 1rem;
            padding: 1rem;
            height: 100vh;
            width: 100vw;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            z-index: 10;
            position: relative;
        }
        
        /* Hide scrollbar for clean look */
        .arena-carousel::-webkit-scrollbar { display: none; }
        .arena-carousel { -ms-overflow-style: none; scrollbar-width: none; }

        /* Individual Model Card */
        .model-card {
            flex: 0 0 calc(100vw - 2rem);
            scroll-snap-align: center;
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 1.25rem;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 2rem);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: border-color 0.3s;
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .model-card { flex: 0 0 calc(50vw - 1.5rem); }
        }
        @media (min-width: 1200px) {
            .model-card { flex: 0 0 calc(33.333vw - 1.33rem); }
        }

        .model-card.running { border-color: rgba(139, 92, 246, 0.5); box-shadow: 0 0 20px rgba(139, 92, 246, 0.2); }
        .model-card.complete { border-color: rgba(16, 185, 129, 0.4); }
        .model-card.failed { border-color: rgba(244, 63, 94, 0.4); }

        /* Card Header */
        .card-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(2, 6, 23, 0.4);
            flex-shrink: 0;
        }

        .card-title-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            overflow: hidden;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
        }
        .status-dot.active { background: #eab308; box-shadow: 0 0 8px #eab308; animation: pulse 1.5s infinite; }
        .status-dot.done { background: var(--accent-emerald); box-shadow: 0 0 8px var(--accent-emerald); }
        .status-dot.error { background: var(--accent-rose); box-shadow: 0 0 8px var(--accent-rose); }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        .card-title {
            font-size: 0.95rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sandbox-btn {
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent-emerald);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 0.5rem;
            padding: 0.35rem 0.75rem;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        .sandbox-btn:hover { background: rgba(16, 185, 129, 0.2); }

        /* Mini Stats */
        .card-stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            background: rgba(2, 6, 23, 0.2);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .stat-box {
            padding: 0.5rem;
            text-align: center;
            border-right: 1px solid var(--border-color);
        }
        .stat-box:last-child { border-right: none; }
        .stat-label { display: block; font-size: 0.55rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 0.2rem; }
        .stat-val { font-size: 0.75rem; font-family: var(--font-mono); font-weight: 600; color: var(--text-main); }

        /* Output Terminal */
        .card-output {
            flex-grow: 1;
            padding: 1rem;
            overflow-y: auto;
            font-size: 0.85rem;
            line-height: 1.6;
            color: #cbd5e1;
        }
        
        .card-output::-webkit-scrollbar { width: 4px; }
        .card-output::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

        /* Formatted Code Blocks */
        .code-block {
            background: var(--bg-input);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 0.5rem;
            margin: 0.75rem 0;
            overflow: hidden;
        }
        .code-header {
            background: rgba(255, 255, 255, 0.04);
            padding: 0.35rem 0.75rem;
            font-size: 0.65rem;
            color: var(--text-muted);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex; justify-content: space-between;
        }
        .code-content {
            padding: 0.75rem;
            overflow-x: auto;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--brand-hover);
        }

        /* Input Area (Bottom) */
        .card-input-area {
            padding: 0.75rem;
            background: rgba(15, 23, 42, 0.9);
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .prompt-textarea {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            padding: 0.75rem;
            color: var(--text-main);
            font-family: var(--font-sans);
            font-size: 0.85rem;
            resize: none;
            height: 60px;
            outline: none;
            transition: all 0.2s;
        }
        .prompt-textarea:focus {
            height: 100px;
            border-color: var(--brand-primary);
        }

        .input-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.5rem;
        }

        .action-btn {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            border: none;
            transition: all 0.2s;
        }
        .btn-solo { background: rgba(255, 255, 255, 0.05); color: var(--text-main); border: 1px solid var(--border-color); }
        .btn-solo:hover { background: rgba(255, 255, 255, 0.1); }
        .btn-all { background: var(--brand-primary); color: white; }
        .btn-all:hover { background: var(--brand-hover); }

        /* Settings Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(2, 6, 23, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 1rem;
            opacity: 1;
            transition: opacity 0.2s;
        }
        .modal-overlay.hidden { opacity: 0; pointer-events: none; }

        .settings-card {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 1.25rem;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }

        .settings-header {
            padding: 1.25rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .settings-header h3 { font-size: 1.1rem; color: #fff; }
        .btn-close { background: none; border: none; color: var(--text-muted); font-size: 1.25rem; cursor: pointer; }
        .btn-close:hover { color: #fff; }

        .settings-body {
            padding: 1.25rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .settings-section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
            font-weight: 700;
        }

        /* Config Toggles */
        .config-group { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .config-chip {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 99px;
            font-size: 0.75rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }
        .config-chip.active { background: rgba(139, 92, 246, 0.2); border-color: var(--brand-primary); color: var(--brand-hover); font-weight: 600; }

        /* Vision Image Upload in Settings */
        .vision-upload {
            border: 2px dashed var(--border-color);
            border-radius: 0.75rem;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
            position: relative;
        }
        .vision-upload:hover { border-color: var(--brand-primary); }
        .vision-preview { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 0.75rem; }
        .vision-content i { font-size: 2rem; color: var(--text-muted); margin-bottom: 0.5rem; }
        .vision-content p { font-size: 0.75rem; color: var(--text-muted); }

        /* Model Selector List */
        .model-list { display: flex; flex-direction: column; gap: 0.5rem; }
        .model-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-input);
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }
        .model-item.selected { border-color: var(--brand-primary); background: rgba(139, 92, 246, 0.1); }
        .model-item.locked { border-color: var(--accent-emerald); background: rgba(16, 185, 129, 0.05); cursor: default; }
        .model-item-left { display: flex; align-items: center; gap: 0.75rem; }
        .check-box { width: 1rem; height: 1rem; border: 1px solid var(--text-muted); border-radius: 0.25rem; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; color: transparent; }
        .model-item.selected .check-box { background: var(--brand-primary); border-color: var(--brand-primary); color: white; }
        .model-item.locked .check-box { background: var(--accent-emerald); border-color: var(--accent-emerald); color: white; }
        
        .btn-delete-model { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 0.25rem; }
        .btn-delete-model:hover { color: var(--accent-rose); }

        /* Add Custom Model */
        .add-model-wrapper { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
        .input-add-model { flex-grow: 1; background: var(--bg-input); border: 1px solid var(--border-color); padding: 0.5rem 0.75rem; border-radius: 0.5rem; color: white; font-size: 0.8rem; outline: none; }
        .input-add-model:focus { border-color: var(--brand-primary); }
        .btn-add-model { background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-main); padding: 0.5rem 1rem; border-radius: 0.5rem; cursor: pointer; transition: all 0.2s; }
        .btn-add-model:hover { background: rgba(255,255,255,0.1); }

        /* Fullscreen Sandbox */
        #sandbox-modal .settings-card { max-width: 1400px; height: 95vh; max-height: 95vh; }
        .sandbox-iframe { flex-grow: 1; background: white; border: none; width: 100%; height: 100%; }

    </style>
</head>
<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <!-- Floating Settings Button -->
    <button class="fab-settings" id="btn-open-settings">
        <i class="fa-solid fa-sliders"></i>
    </button>

    <!-- Main Swipeable Carousel -->
    <div class="arena-carousel" id="carousel">
        <!-- Cards injected dynamically -->
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay hidden" id="settings-modal">
        <div class="settings-card">
            <div class="settings-header">
                <h3>Arena Configuration</h3>
                <button class="btn-close" id="btn-close-settings"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="settings-body">
                
                <div>
                    <div class="settings-section-title">Master Directive Mode</div>
                    <div class="config-group" id="mode-toggles">
                        <div class="config-chip active" data-mode="chat"><i class="fa-regular fa-comment-dots mr-1"></i> Chat & Logic</div>
                        <div class="config-chip" data-mode="code"><i class="fa-solid fa-code mr-1"></i> Coding Engine</div>
                        <div class="config-chip" data-mode="vision"><i class="fa-solid fa-eye mr-1"></i> Vision Analysis</div>
                    </div>
                </div>

                <div id="vision-settings" class="hidden">
                    <div class="settings-section-title">Vision Target Image</div>
                    <div class="vision-upload" id="vision-dropzone">
                        <div class="vision-content" id="vision-content">
                            <i class="fa-solid fa-image"></i>
                            <p>Tap to select image</p>
                        </div>
                        <img id="vision-preview" class="vision-preview hidden" />
                        <input type="file" id="vision-input" class="hidden" accept="image/*" />
                    </div>
                </div>

                <div>
                    <div class="settings-section-title">Active Models</div>
                    <div class="model-list" id="model-list-container">
                        <!-- Loaded dynamically -->
                    </div>
                    
                    <div class="add-model-wrapper">
                        <input type="text" id="input-new-model" class="input-add-model" placeholder="Custom model code (e.g. llama-3)">
                        <button class="btn-add-model" id="btn-add-model"><i class="fa-solid fa-plus"></i></button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Sandbox Modal -->
    <div class="modal-overlay hidden" id="sandbox-modal">
        <div class="settings-card">
            <div class="settings-header">
                <h3><i class="fa-solid fa-gamepad text-emerald-500 mr-2"></i> Live Sandbox Environment</h3>
                <button class="btn-close" id="btn-close-sandbox"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <iframe class="sandbox-iframe" id="sandbox-iframe" sandbox="allow-scripts allow-modals allow-same-origin allow-popups"></iframe>
        </div>
    </div>

    <script>
        // API Configuration
        const API_STREAM_ENDPOINT = "https://gen.pollinations.ai/v1/chat/completions";
        const MASTER_API_KEY = "sk_7KFlmv5B9osxLHlKgPrDBrGUYZG7UHZN";

        // Model Management State
        const BASE_MODELS = ["polly", "openai", "perplexity-reasoning", "glm", "qwen-large", "grok", "openai-large", "kimi-k2.6"];
        
        let appState = {
            mode: 'chat',
            base64Image: null,
            customModels: JSON.parse(localStorage.getItem('custom_models') || '[]'),
            activeModels: JSON.parse(localStorage.getItem('active_models') || JSON.stringify(["polly", "openai"])),
            streams: {}
        };

        // DOM Elements
        const UI = {
            carousel: document.getElementById('carousel'),
            btnOpenSettings: document.getElementById('btn-open-settings'),
            settingsModal: document.getElementById('settings-modal'),
            btnCloseSettings: document.getElementById('btn-close-settings'),
            
            modeToggles: document.querySelectorAll('.config-chip'),
            visionSettings: document.getElementById('vision-settings'),
            visionDropzone: document.getElementById('vision-dropzone'),
            visionInput: document.getElementById('vision-input'),
            visionPreview: document.getElementById('vision-preview'),
            visionContent: document.getElementById('vision-content'),
            
            modelListContainer: document.getElementById('model-list-container'),
            inputNewModel: document.getElementById('input-new-model'),
            btnAddModel: document.getElementById('btn-add-model'),

            sandboxModal: document.getElementById('sandbox-modal'),
            btnCloseSandbox: document.getElementById('btn-close-sandbox'),
            sandboxIframe: document.getElementById('sandbox-iframe')
        };

        function initApp() {
            // Modals
            UI.btnOpenSettings.onclick = () => UI.settingsModal.classList.remove('hidden');
            UI.btnCloseSettings.onclick = () => UI.settingsModal.classList.add('hidden');
            UI.btnCloseSandbox.onclick = () => { UI.sandboxModal.classList.add('hidden'); UI.sandboxIframe.srcdoc = ""; };

            // Mode Toggles
            UI.modeToggles.forEach(chip => {
                chip.onclick = () => {
                    UI.modeToggles.forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');
                    appState.mode = chip.dataset.mode;
                    if(appState.mode === 'vision') UI.visionSettings.classList.remove('hidden');
                    else UI.visionSettings.classList.add('hidden');
                };
            });

            // Vision Image Logic
            UI.visionDropzone.onclick = () => UI.visionInput.click();
            UI.visionInput.onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        appState.base64Image = reader.result;
                        UI.visionPreview.src = reader.result;
                        UI.visionPreview.classList.remove('hidden');
                        UI.visionContent.classList.add('hidden');
                    };
                    reader.readAsDataURL(file);
                }
            };

            // Custom Model Add
            UI.btnAddModel.onclick = () => {
                const newModel = UI.inputNewModel.value.trim().toLowerCase();
                if(newModel && !BASE_MODELS.includes(newModel) && !appState.customModels.includes(newModel)) {
                    appState.customModels.push(newModel);
                    appState.activeModels.push(newModel); // Auto-select new
                    saveState();
                    renderSettingsModels();
                    renderCarousel();
                    UI.inputNewModel.value = '';
                }
            };

            // Initialize rendering
            enforcePolly();
            renderSettingsModels();
            renderCarousel();
        }

        function enforcePolly() {
            if(!appState.activeModels.includes("polly")) {
                appState.activeModels.unshift("polly");
                saveState();
            }
        }

        function saveState() {
            localStorage.setItem('custom_models', JSON.stringify(appState.customModels));
            localStorage.setItem('active_models', JSON.stringify(appState.activeModels));
        }

        // Render Settings Model List
        function renderSettingsModels() {
            UI.modelListContainer.innerHTML = '';
            const allModels = [...BASE_MODELS, ...appState.customModels];

            allModels.forEach(mName => {
                const isPolly = mName === "polly";
                const isSelected = appState.activeModels.includes(mName);
                const isCustom = appState.customModels.includes(mName);

                const item = document.createElement('div');
                item.className = `model-item ${isSelected ? 'selected' : ''} ${isPolly ? 'locked' : ''}`;
                
                item.innerHTML = `
                    <div class="model-item-left">
                        <div class="check-box"><i class="fa-solid fa-check"></i></div>
                        <span style="font-size: 0.85rem; color: #fff;">${mName}</span>
                    </div>
                    ${isCustom ? `<button class="btn-delete-model"><i class="fa-solid fa-trash-can"></i></button>` : ''}
                `;

                if(!isPolly) {
                    item.onclick = (e) => {
                        // Prevent click if targeting trash
                        if(e.target.closest('.btn-delete-model')) return;

                        if (appState.activeModels.includes(mName)) {
                            appState.activeModels = appState.activeModels.filter(m => m !== mName);
                        } else {
                            appState.activeModels.push(mName);
                        }
                        saveState();
                        renderSettingsModels();
                        renderCarousel();
                    };
                }

                if(isCustom) {
                    const btnDel = item.querySelector('.btn-delete-model');
                    btnDel.onclick = (e) => {
                        e.stopPropagation();
                        appState.customModels = appState.customModels.filter(m => m !== mName);
                        appState.activeModels = appState.activeModels.filter(m => m !== mName);
                        saveState();
                        renderSettingsModels();
                        renderCarousel();
                    };
                }

                UI.modelListContainer.appendChild(item);
            });
        }

        // Render Carousel Cards
        function renderCarousel() {
            UI.carousel.innerHTML = '';
            
            appState.activeModels.forEach(mName => {
                const card = document.createElement('div');
                card.className = `model-card`;
                card.id = `card-${mName}`;

                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-title-group">
                            <div class="status-dot" id="dot-${mName}"></div>
                            <div class="card-title">${mName}</div>
                        </div>
                        <button class="sandbox-btn hidden" id="sandbox-btn-${mName}"><i class="fa-solid fa-play"></i> Run Code</button>
                    </div>
                    <div class="card-stats">
                        <div class="stat-box"><span class="stat-label">TTFT</span><span class="stat-val" id="ttft-${mName}">--</span></div>
                        <div class="stat-box"><span class="stat-label">Speed</span><span class="stat-val" style="color: var(--brand-hover);" id="speed-${mName}">--</span></div>
                        <div class="stat-box"><span class="stat-label">Time</span><span class="stat-val" id="time-${mName}">--</span></div>
                    </div>
                    <div class="card-output" id="output-${mName}">
                        <div style="height:100%; display:flex; align-items:center; justify-content:center; color: var(--text-muted); font-size: 0.8rem; font-style: italic;">
                            Ready for prompt...
                        </div>
                    </div>
                    <div class="card-input-area">
                        <textarea class="prompt-textarea" id="prompt-${mName}" placeholder="Prompt ${mName} directly..."></textarea>
                        <div class="input-actions">
                            <button class="action-btn btn-solo" onclick="runSolo('${mName}')"><i class="fa-solid fa-paper-plane"></i> Solo</button>
                            <button class="action-btn btn-all" onclick="runAll('${mName}')"><i class="fa-solid fa-layer-group"></i> Send to All</button>
                        </div>
                    </div>
                `;
                
                UI.carousel.appendChild(card);
            });
        }

        // Execution Logic
        async function runSolo(sourceModel) {
            const promptStr = document.getElementById(`prompt-${sourceModel}`).value.trim();
            if(!promptStr) return;
            executeModel(sourceModel, promptStr);
        }

        async function runAll(sourceModel) {
            const promptStr = document.getElementById(`prompt-${sourceModel}`).value.trim();
            if(!promptStr) return;

            // Sync prompt to all other textareas for visual clarity
            appState.activeModels.forEach(mName => {
                const ta = document.getElementById(`prompt-${mName}`);
                if(ta) ta.value = promptStr;
            });

            // Execute all concurrently (Parallel)
            appState.activeModels.forEach(mName => executeModel(mName, promptStr));
        }

        async function executeModel(modelName, promptText) {
            if(appState.mode === 'vision' && !appState.base64Image) {
                alert("Please open settings and load an image for Vision Mode.");
                UI.settingsModal.classList.remove('hidden');
                return;
            }

            const DOMCard = document.getElementById(`card-${modelName}`);
            const DOMDot = document.getElementById(`dot-${modelName}`);
            const DOMOutput = document.getElementById(`output-${modelName}`);
            const DOMSandboxBtn = document.getElementById(`sandbox-btn-${modelName}`);
            const DOMTtft = document.getElementById(`ttft-${modelName}`);
            const DOMSpeed = document.getElementById(`speed-${modelName}`);
            const DOMTime = document.getElementById(`time-${modelName}`);

            // Pre-process messages
            let messages = [];
            if(appState.mode === 'vision') {
                messages = [{ role: "user", content: [ { type: "text", text: promptText }, { type: "image_url", image_url: { url: appState.base64Image } } ] }];
            } else {
                let finalPrompt = promptText;
                // Add specific strictness for code generation
                if(appState.mode === 'code') finalPrompt += "\n\nCRITICAL: Output ONLY raw HTML/JS/CSS code in standard markdown ```html blocks. No conversational text.";
                messages = [{ role: "user", content: finalPrompt }];
            }

            const isPolly = modelName === "polly";
            const shouldStream = !isPolly;

            try {
                DOMCard.className = "model-card running";
                DOMDot.className = "status-dot active";
                DOMSandboxBtn.classList.add('hidden');
                DOMOutput.innerHTML = `<div style="height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0.5rem; color:var(--brand-primary); font-size: 0.8rem;"><i class="fa-solid fa-circle-notch fa-spin text-xl"></i> Processing...</div>`;
                
                const tStart = performance.now();
                let tFirstToken = null;
                let gatheredText = "";

                const res = await fetch(API_STREAM_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${MASTER_API_KEY}` },
                    body: JSON.stringify({ model: modelName, messages, stream: shouldStream, temperature: 0.6 })
                });

                if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);

                DOMOutput.innerHTML = "";

                if (!shouldStream) {
                    const rawData = await res.json();
                    tFirstToken = performance.now();
                    DOMTtft.textContent = `${(tFirstToken - tStart).toFixed(0)}ms`;
                    gatheredText = rawData.choices?.[0]?.message?.content || "";
                    DOMOutput.textContent = gatheredText;
                } else {
                    const reader = res.body.getReader();
                    const decoder = new TextDecoder();
                    let finished = false;
                    let textBuffer = "";

                    while (!finished) {
                        const { value, done } = await reader.read();
                        if (done) { finished = true; break; }
                        if (value) {
                            if (!tFirstToken) {
                                tFirstToken = performance.now();
                                DOMTtft.textContent = `${(tFirstToken - tStart).toFixed(0)}ms`;
                            }
                            textBuffer += decoder.decode(value, { stream: true });
                            const lines = textBuffer.split('\n');
                            textBuffer = lines.pop(); 
                            for (const line of lines) {
                                const trimmed = line.trim();
                                if (!trimmed || trimmed === 'data: [DONE]') continue;
                                if (trimmed.startsWith('data: ')) {
                                    try {
                                        const parsed = JSON.parse(trimmed.slice(6));
                                        const nextChunk = parsed.choices?.[0]?.delta?.content || "";
                                        if (nextChunk) {
                                            gatheredText += nextChunk;
                                            DOMOutput.textContent = gatheredText;
                                            DOMOutput.scrollTop = DOMOutput.scrollHeight;
                                        }
                                    } catch(e) {}
                                }
                            }
                        }
                    }
                    if (textBuffer && textBuffer.startsWith('data: ')) {
                        try {
                            const parsed = JSON.parse(textBuffer.trim().slice(6));
                            gatheredText += parsed.choices?.[0]?.delta?.content || "";
                            DOMOutput.textContent = gatheredText;
                        } catch(e) {}
                    }
                }

                const tEnd = performance.now();
                const durationSec = ((tEnd - tStart) / 1000).toFixed(2);
                const estimatedTokens = Math.round(gatheredText.length / 4);
                
                DOMTime.textContent = `${durationSec}s`;
                DOMSpeed.textContent = durationSec > 0 ? `${(estimatedTokens / durationSec).toFixed(1)} t/s` : '0';

                // Format Markdown 
                DOMOutput.innerHTML = formatMarkdownBlocks(gatheredText);
                DOMCard.className = "model-card complete";
                DOMDot.className = "status-dot done";

                // Extract HTML for Sandbox
                const extractedHtmlCode = extractCodeSnippet(gatheredText);
                if ((extractedHtmlCode.includes('</html>') || extractedHtmlCode.includes('<!DOCTYPE html>') || appState.mode === 'code') && extractedHtmlCode.trim().length > 0) {
                    DOMSandboxBtn.classList.remove('hidden');
                    DOMSandboxBtn.onclick = () => {
                        UI.sandboxIframe.srcdoc = extractedHtmlCode;
                        UI.sandboxModal.classList.remove('hidden');
                    };
                }

            } catch (err) {
                DOMOutput.innerHTML = `<div style="background: rgba(244, 63, 94, 0.1); border: 1px solid rgba(244, 63, 94, 0.3); padding: 1rem; border-radius: 0.5rem; color: var(--accent-rose); font-size: 0.8rem;"><i class="fa-solid fa-triangle-exclamation mr-1"></i> ${err.message}</div>`;
                DOMCard.className = "model-card failed";
                DOMDot.className = "status-dot error";
            }
        }

        // Markdown Formatting Helpers
        function extractCodeSnippet(text) {
            if (!text) return "";
            const regex = new RegExp('`{3}(?:html|xml)?\\\\s*([\\\\s\\\\S]*?)`{3}', 'i');
            const match = text.match(regex);
            if (match && match[1]) return match[1].trim();
            if (text.includes('<html')) {
                const s = text.indexOf('<html');
                const e = text.lastIndexOf('</html>');
                if (e !== -1) return text.substring(s, e + 7).trim();
                return text.substring(s).trim();
            }
            return text.trim();
        }

        function escapeHTMLTags(unsafe) {
            return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function formatMarkdownBlocks(text) {
            const splitRegex = new RegExp('(`{3}[\\\\s\\\\S]*?`{3})', 'g');
            const splitParts = text.split(splitRegex);
            let html = "";
            splitParts.forEach(block => {
                if (block.startsWith('```') && block.endsWith('```')) {
                    let extracted = block.slice(3, -3);
                    const lb = extracted.indexOf('\n');
                    let lang = "CODE";
                    if (lb !== -1 && lb < 15) {
                        const l = extracted.substring(0, lb).trim();
                        if (l) lang = l.toUpperCase();
                        extracted = extracted.substring(lb + 1);
                    }
                    html += `<div class="code-block"><div class="code-header"><span>${lang}</span><i class="fa-solid fa-code"></i></div><div class="code-content custom-scrollbar">${escapeHTMLTags(extracted)}</div></div>`;
                } else {
                    html += `<span>${escapeHTMLTags(block).replace(/\n/g, '<br/>')}</span>`;
                }
            });
            return html;
        }

        // Init
        window.onload = initApp;
    </script>
</body>
</html>
