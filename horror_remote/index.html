<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0a0000"/>
<title>Horror Remote • D'Verse</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="./sfx-data.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@400;600;700&display=swap');
body{font-family:Inter,sans-serif;background:radial-gradient(ellipse at center,#1a0505 0%,#050000 70%);color:#e8e0d0;min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.font-horror{font-family:Creepster,cursive}
.glass{background:rgba(20,5,5,.65);backdrop-filter:blur(14px);border:1px solid rgba(180,40,40,.25)}
.pad{width:110px;height:110px;border-radius:18px;background:rgba(40,8,8,.7);border:1px solid rgba(200,50,50,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none}
.pad:active,.pad.playing{transform:scale(.94);box-shadow:0 0 28px rgba(220,30,30,.55);border-color:#ef4444}
.pad .icon{font-size:28px;margin-bottom:4px}
.status-dot{width:10px;height:10px;border-radius:50%}
.status-dot.connected{background:#22c55e;box-shadow:0 0 10px #22c55e}
.status-dot.waiting{background:#eab308;animation:pulse 1.4s infinite}
.status-dot.offline{background:#ef4444}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.btn-horror{background:linear-gradient(135deg,#7f1d1d,#450a0a);border:1px solid #b91c1c}
.hide{display:none!important}
#player-screen,#controller-screen{min-height:100dvh}
.pin-btn{opacity:.45}.pin-btn.pinned{opacity:1;color:#fbbf24}
input[type=range]{accent-color:#ef4444}
</style>
</head>
<body class="flex flex-col">
<div id="mode-select" class="flex-1 flex flex-col items-center justify-center p-6 gap-8">
  <div class="text-center"><h1 class="font-horror text-5xl text-red-500 tracking-wider mb-2">HORROR REMOTE</h1>
  <p class="text-neutral-400 text-sm tracking-widest uppercase">D'Verse • Two-phone soundboard</p></div>
  <div class="flex flex-col gap-4 w-full max-w-xs">
    <button onclick="startAs('player')" class="btn-horror rounded-2xl py-5 px-6 text-lg font-bold">🎧 PLAYER<br><span class="text-xs font-normal opacity-70">This phone plays the sounds</span></button>
    <button onclick="startAs('controller')" class="btn-horror rounded-2xl py-5 px-6 text-lg font-bold">🕹️ CONTROLLER<br><span class="text-xs font-normal opacity-70">This phone controls the other</span></button>
  </div>
</div>
<div id="player-screen" class="hide flex flex-col p-5 gap-5">
  <header class="glass rounded-2xl p-4 flex items-center justify-between">
    <div class="flex items-center gap-3"><div id="p-status-dot" class="status-dot waiting"></div>
    <div><div class="text-xs text-neutral-400 uppercase tracking-widest">Player Mode</div>
    <div id="p-status-text" class="text-sm font-semibold">Waiting…</div></div></div>
    <button onclick="location.reload()" class="text-neutral-500 text-xs">Exit</button>
  </header>
  <div id="unlock-gate" class="glass rounded-2xl p-8 flex flex-col items-center gap-4 flex-1 justify-center">
    <div class="font-horror text-5xl text-red-500">🔓</div>
    <button onclick="unlockAudio()" class="btn-horror rounded-2xl px-8 py-4 text-lg font-bold">TAP TO ENABLE AUDIO</button>
    <p class="text-neutral-500 text-xs text-center">Required so audio works after lock/sleep.</p>
  </div>
  <div id="player-main" class="hide flex flex-col gap-4 flex-1">
    <div class="glass rounded-2xl p-8 flex flex-col items-center gap-4 flex-1 justify-center">
      <div class="font-horror text-6xl text-red-600/80">🎧</div>
      <div class="text-center"><div class="text-neutral-400 text-sm mb-1">Share this room code</div>
      <div id="room-code" class="font-horror text-5xl tracking-[0.3em] text-red-400 select-all">······</div></div>
    </div>
    <div class="glass rounded-2xl p-4 text-center">
      <div class="text-xs text-neutral-500 uppercase tracking-widest mb-1">Now Playing</div>
      <div id="now-playing" class="text-sm font-medium text-red-300">— silent —</div>
      <div id="preload-status" class="text-xs text-neutral-500 mt-2"></div>
    </div>
  </div>
</div>
<div id="controller-screen" class="hide flex flex-col p-4 gap-4">
  <header class="glass rounded-2xl p-3 flex items-center justify-between gap-3">
    <div class="flex items-center gap-2"><div id="c-status-dot" class="status-dot offline"></div>
    <div id="c-status-text" class="text-xs font-semibold">Not connected</div></div>
    <div class="flex items-center gap-2">
      <input id="join-code" type="text" maxlength="6" placeholder="Code" class="bg-black/40 border border-red-900/50 rounded-lg px-3 py-1.5 text-sm w-24 tracking-widest text-center uppercase" oninput="this.value=this.value.toUpperCase()"/>
      <button onclick="connectToRoom()" class="btn-horror rounded-lg px-3 py-1.5 text-xs font-bold">JOIN</button>
    </div>
  </header>
  <div class="glass rounded-2xl p-4 flex-1">
    <div class="text-xs text-neutral-500 uppercase tracking-widest mb-3">Horror Pads</div>
    <div id="pad-grid" class="flex flex-wrap justify-center gap-3"></div>
  </div>
  <div id="transport" class="glass rounded-2xl p-4 hide">
    <div class="text-xs text-neutral-500 uppercase tracking-widest mb-2">Now Playing</div>
    <div id="c-now-title" class="text-sm font-medium text-red-300 mb-2 truncate">—</div>
    <div class="flex items-center gap-2 mb-2">
      <span id="c-time-cur" class="text-xs text-neutral-500 w-10">0:00</span>
      <input id="seek-bar" type="range" min="0" max="1000" value="0" class="flex-1 h-2" onchange="sendCmd({type:'seek',ratio:Number(this.value)/1000})"/>
      <span id="c-time-dur" class="text-xs text-neutral-500 w-10 text-right">0:00</span>
    </div>
    <div class="flex gap-2">
      <button onclick="sendCmd({type:'pause'})" class="btn-horror flex-1 rounded-lg py-2 text-sm font-bold">⏸ Pause</button>
      <button onclick="sendCmd({type:'resume'})" class="btn-horror flex-1 rounded-lg py-2 text-sm font-bold">▶ Play</button>
      <button onclick="sendCmd({type:'stop'})" class="bg-red-950/80 border border-red-700 flex-1 rounded-lg py-2 text-sm font-bold text-red-300">⏹ Stop</button>
    </div>
  </div>
  <div class="glass rounded-2xl p-4">
    <div class="flex items-center justify-between mb-2">
      <div class="text-xs text-neutral-500 uppercase tracking-widest">D'Tunes</div>
      <button onclick="preloadPinnedOnPlayer()" id="preload-btn" class="btn-horror rounded-lg px-3 py-1 text-xs font-bold disabled:opacity-40" disabled>Preload Pinned → Player</button>
    </div>
    <div class="flex gap-2 mb-3">
      <input id="saavn-query" type="search" placeholder="Search…" class="flex-1 bg-black/40 border border-red-900/40 rounded-lg px-3 py-2 text-sm" onkeydown="if(event.key==='Enter')searchSaavn()"/>
      <button onclick="searchSaavn()" class="btn-horror rounded-lg px-4 py-2 text-sm font-bold">Go</button>
    </div>
    <div id="saavn-results" class="max-h-40 overflow-y-auto space-y-1 text-sm"></div>
    <div id="pinned-section" class="mt-3 pt-3 border-t border-red-950/60 hide">
      <div class="text-xs text-neutral-500 uppercase tracking-widest mb-2">Pinned</div>
      <div id="pinned-list" class="space-y-1 text-sm"></div>
    </div>
  </div>
  <div class="flex gap-2">
    <button onclick="sendCmd({type:'stop'})" class="flex-1 bg-red-950/80 border border-red-700 rounded-xl py-3 text-sm font-bold text-red-300">🛑 STOP ALL</button>
    <button onclick="location.reload()" class="px-4 text-neutral-500 text-xs">Exit</button>
  </div>
</div>
<script>
const SOUNDS=[
{id:'whisper',name:'Whisper',emoji:'🗣️',color:'#a855f7'},
{id:'jumpscare',name:'Jumpscare',emoji:'😱',color:'#ef4444'},
{id:'doorcreak',name:'Door Creak',emoji:'🚪',color:'#f97316'},
{id:'heartbeat',name:'Heartbeat',emoji:'❤️',color:'#e11d48'},
{id:'scream',name:'Scream',emoji:'👻',color:'#f43f5e'},
{id:'footsteps',name:'Footsteps',emoji:'👣',color:'#78716c'},
{id:'thunder',name:'Thunder',emoji:'⚡',color:'#3b82f6'},
{id:'laugh',name:'Evil Laugh',emoji:'😈',color:'#84cc16'},
{id:'chains',name:'Chains',emoji:'⛓️',color:'#a1a1aa'},
{id:'wind',name:'Ghost Wind',emoji:'💨',color:'#67e8f9'},
{id:'growl',name:'Growl',emoji:'🐺',color:'#b45309'},
{id:'bell',name:'Death Bell',emoji:'🔔',color:'#fbbf24'},
];
const ICE={iceServers:[
{urls:'stun:stun.l.google.com:19302'},
{urls:'stun:stun1.l.google.com:19302'},
{urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},
{urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},
{urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'},
]};
let peer=null,conn=null,mode=null,roomCode='',pinnedSongs=[];
let audioUnlocked=false,sfxPool={},songPool={},currentSong=null,currentSongMeta=null,keepalive=null,progressTimer=null;

function setPlaybackSession(){try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}}
function unlockAudio(){
  setPlaybackSession();
  const silent=new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA');
  silent.volume=0.01;silent.play().catch(()=>{});
  if(!keepalive){keepalive=new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA');keepalive.loop=true;keepalive.volume=0.001;}
  keepalive.play().catch(()=>{});
  const data=window.SFX_DATA||{};
  SOUNDS.forEach(s=>{if(data[s.id]){const a=new Audio(data[s.id]);a.preload='auto';a.load();sfxPool[s.id]=a;}});
  audioUnlocked=true;
  document.getElementById('unlock-gate').classList.add('hide');
  document.getElementById('player-main').classList.remove('hide');
  setPlayerStatus(conn&&conn.open?'connected':'waiting',conn&&conn.open?'Controller connected!':'Waiting for controller…');
}
function setupMediaSession(title,artist){
  if(!('mediaSession' in navigator))return;
  try{
    navigator.mediaSession.metadata=new MediaMetadata({title:title||'Horror Remote',artist:artist||"D'Verse",album:"D'Tunes"});
    navigator.mediaSession.setActionHandler('play',()=>{if(currentSong)currentSong.play();});
    navigator.mediaSession.setActionHandler('pause',()=>{if(currentSong)currentSong.pause();});
    navigator.mediaSession.setActionHandler('stop',()=>stopAll());
  }catch(e){}
}
function setNowPlaying(t){const el=document.getElementById('now-playing');if(el)el.textContent=t;}
function playSFX(id){
  if(!audioUnlocked)return;setPlaybackSession();
  const base=sfxPool[id];if(!base)return;
  const a=base.cloneNode();a.volume=1;a.play().catch(()=>{});
  const s=SOUNDS.find(x=>x.id===id);setNowPlaying(s?s.name:id);setupMediaSession(s?s.name:id,'Horror SFX');
}
function stopAll(){
  if(currentSong){try{currentSong.pause();currentSong.currentTime=0;}catch(e){}currentSong=null;currentSongMeta=null;}
  setNowPlaying('— silent —');reportProgress();
}
function playSong(id,url,title){
  if(!audioUnlocked)return;setPlaybackSession();stopAll();
  let a=songPool[id];
  if(!a){a=new Audio();a.crossOrigin='anonymous';a.preload='auto';a.src=url;songPool[id]=a;}
  a.currentTime=0;a.volume=1;currentSong=a;currentSongMeta={id,url,title};
  a.onended=()=>{setNowPlaying('— silent —');reportProgress();};
  a.play().catch(()=>{});
  setNowPlaying(title||'Song');setupMediaSession(title||'Song',"D'Tunes");startProgressLoop();
}
function pauseSong(){if(currentSong&&!currentSong.paused){currentSong.pause();reportProgress();}}
function resumeSong(){if(!audioUnlocked)return;setPlaybackSession();if(currentSong&&currentSong.paused){currentSong.play().catch(()=>{});startProgressLoop();}}
function seekSong(ratio){if(!currentSong||!isFinite(currentSong.duration))return;currentSong.currentTime=ratio*currentSong.duration;reportProgress();}
async function preloadSong(url,id){
  if(songPool[id])return true;
  try{const a=new Audio();a.crossOrigin='anonymous';a.preload='auto';a.src=url;
  await new Promise(r=>{a.addEventListener('canplaythrough',r,{once:true});a.addEventListener('error',r,{once:true});a.load();setTimeout(r,15000);});
  songPool[id]=a;return true;}catch{return false;}
}
function reportProgress(){
  if(!conn||!conn.open)return;
  if(!currentSong){conn.send({type:'progress',playing:false,title:'',cur:0,dur:0});return;}
  conn.send({type:'progress',playing:!currentSong.paused,title:currentSongMeta?.title||'',cur:currentSong.currentTime||0,dur:currentSong.duration||0});
}
function startProgressLoop(){
  if(progressTimer)clearInterval(progressTimer);
  progressTimer=setInterval(()=>{if(currentSong)reportProgress();else if(progressTimer){clearInterval(progressTimer);progressTimer=null;}},500);
}
function generateCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=c[Math.floor(Math.random()*c.length)];return s;}
function startAs(m){
  mode=m;document.getElementById('mode-select').classList.add('hide');
  if(m==='player'){
    document.getElementById('player-screen').classList.remove('hide');
    roomCode=generateCode();document.getElementById('room-code').textContent=roomCode;
    peer=new Peer(roomCode,{debug:1,config:ICE});
    peer.on('connection',c=>{conn=c;setupConnection(c);if(audioUnlocked)setPlayerStatus('connected','Controller connected!');});
    peer.on('error',()=>setPlayerStatus('offline','Error – refresh'));
  }else{
    document.getElementById('controller-screen').classList.remove('hide');
    renderPads();loadPinnedFromStorage();
  }
}
function connectToRoom(){
  const code=document.getElementById('join-code').value.trim().toUpperCase();
  if(code.length<4)return alert('Enter room code');
  peer=new Peer({debug:1,config:ICE});
  peer.on('open',()=>{conn=peer.connect(code,{reliable:true,serialization:'json'});setupConnection(conn);});
  peer.on('error',()=>{setControllerStatus('offline','Failed');alert('Connect failed. Same Wi-Fi helps. Player must enable audio.');});
}
function setupConnection(c){
  c.on('open',()=>{
    if(mode==='controller'){setControllerStatus('connected','Connected!');document.getElementById('preload-btn').disabled=false;}
    if(mode==='player'&&audioUnlocked)setPlayerStatus('connected','Controller connected!');
  });
  c.on('data',d=>{if(mode==='player')handlePlayerCmd(d);if(mode==='controller')handleControllerMsg(d);});
  c.on('close',()=>{
    if(mode==='player')setPlayerStatus('waiting','Disconnected');
    if(mode==='controller'){setControllerStatus('offline','Disconnected');document.getElementById('preload-btn').disabled=true;}
  });
}
function setPlayerStatus(s,t){document.getElementById('p-status-dot').className='status-dot '+s;document.getElementById('p-status-text').textContent=t;}
function setControllerStatus(s,t){document.getElementById('c-status-dot').className='status-dot '+s;document.getElementById('c-status-text').textContent=t;}
function sendCmd(cmd){if(conn&&conn.open)conn.send(cmd);}
async function handlePlayerCmd(cmd){
  if(!audioUnlocked)return;
  if(cmd.type==='play')playSFX(cmd.id);
  else if(cmd.type==='stop')stopAll();
  else if(cmd.type==='pause')pauseSong();
  else if(cmd.type==='resume')resumeSong();
  else if(cmd.type==='seek')seekSong(cmd.ratio||0);
  else if(cmd.type==='song')playSong(cmd.id||cmd.url,cmd.url,cmd.title);
  else if(cmd.type==='preload'){
    const list=cmd.songs||[];const st=document.getElementById('preload-status');let done=0;
    st.textContent=`Preloading 0/${list.length}…`;
    for(const s of list){await preloadSong(s.url,s.id);done++;st.textContent=`Preloaded ${done}/${list.length}`;}
    st.textContent=`Ready • ${list.length} songs cached`;
  }
}
function handleControllerMsg(msg){
  if(msg.type!=='progress')return;
  document.getElementById('transport').classList.remove('hide');
  document.getElementById('c-now-title').textContent=msg.title||'—';
  document.getElementById('c-time-cur').textContent=fmt(msg.cur);
  document.getElementById('c-time-dur').textContent=fmt(msg.dur);
  const bar=document.getElementById('seek-bar');
  if(msg.dur>0&&document.activeElement!==bar)bar.value=Math.round((msg.cur/msg.dur)*1000);
}
function fmt(sec){if(!sec||!isFinite(sec))return'0:00';const m=Math.floor(sec/60),s=Math.floor(sec%60);return m+':'+String(s).padStart(2,'0');}
function renderPads(){
  const grid=document.getElementById('pad-grid');grid.innerHTML='';
  SOUNDS.forEach(s=>{
    const div=document.createElement('div');div.className='pad';
    div.innerHTML=`<div class="icon">${s.emoji}</div><div class="text-xs font-semibold">${s.name}</div>`;
    div.style.borderColor=s.color+'55';
    div.onpointerdown=e=>{e.preventDefault();div.classList.add('playing');sendCmd({type:'play',id:s.id});setTimeout(()=>div.classList.remove('playing'),350);};
    grid.appendChild(div);
  });
}
function loadPinnedFromStorage(){try{pinnedSongs=JSON.parse(localStorage.getItem('horror_pinned')||'[]');}catch{pinnedSongs=[];}renderPinned();}
function savePinned(){localStorage.setItem('horror_pinned',JSON.stringify(pinnedSongs));renderPinned();}
function togglePin(song){const i=pinnedSongs.findIndex(p=>p.id===song.id);if(i>=0)pinnedSongs.splice(i,1);else pinnedSongs.push(song);savePinned();}
function renderPinned(){
  const section=document.getElementById('pinned-section'),list=document.getElementById('pinned-list');
  if(!pinnedSongs.length){section.classList.add('hide');return;}
  section.classList.remove('hide');
  list.innerHTML=pinnedSongs.map(s=>`<div class="flex items-center justify-between gap-2 py-1.5 border-b border-red-950/40"><div class="min-w-0 flex-1"><div class="truncate font-medium text-sm">${s.title}</div><div class="truncate text-xs text-neutral-500">${s.artists||''}</div></div><div class="flex gap-1"><button onclick="playPinned('${s.id}')" class="btn-horror rounded-lg px-2.5 py-1 text-xs font-bold">Play</button><button onclick="togglePin({id:'${s.id}'})" class="text-yellow-400 text-sm px-1">★</button></div></div>`).join('');
}
function playPinned(id){const s=pinnedSongs.find(p=>p.id===id);if(!s)return;sendCmd({type:'song',id:s.id,url:s.url,title:s.title});document.getElementById('transport').classList.remove('hide');document.getElementById('c-now-title').textContent=s.title;}
function preloadPinnedOnPlayer(){
  if(!conn||!conn.open)return alert('Connect first');
  if(!pinnedSongs.length)return alert('Pin songs first');
  sendCmd({type:'preload',songs:pinnedSongs});
  const btn=document.getElementById('preload-btn');btn.textContent='Sent ✓';setTimeout(()=>btn.textContent='Preload Pinned → Player',2000);
}
async function searchSaavn(){
  const q=document.getElementById('saavn-query').value.trim();if(!q)return;
  const box=document.getElementById('saavn-results');box.innerHTML='<div class="text-neutral-500 text-xs">Searching…</div>';
  try{
    const res=await fetch('https://saavn.sumit.co/api/search/songs?query='+encodeURIComponent(q)+'&limit=10');
    const json=await res.json();const results=json?.data?.results||[];
    if(!results.length){box.innerHTML='<div class="text-neutral-500 text-xs">No results</div>';return;}
    box.innerHTML=results.map(r=>{
      const title=(r.name||'Unknown').replace(/'/g,"\\'");
      const artists=((r.artists?.primary||[]).map(a=>a.name).join(', ')||r.primaryArtists||'').replace(/'/g,"\\'");
      let url='';if(r.downloadUrl&&r.downloadUrl.length)url=r.downloadUrl[r.downloadUrl.length-1]?.url||r.downloadUrl[0]?.url||'';
      const id=r.id||url;const pinned=pinnedSongs.some(p=>p.id===id);
      return `<div class="flex items-center justify-between gap-2 py-1.5 border-b border-red-950/50"><div class="min-w-0 flex-1"><div class="truncate font-medium text-sm">${r.name||'Unknown'}</div><div class="truncate text-xs text-neutral-500">${(r.artists?.primary||[]).map(a=>a.name).join(', ')||r.primaryArtists||''}</div></div><div class="flex gap-1"><button onclick="playFromSearch('${id}','${url}','${title}')" class="btn-horror rounded-lg px-2.5 py-1 text-xs font-bold ${url?'':'opacity-40'}" ${url?'':'disabled'}>Play</button><button onclick="togglePinFromSearch('${id}','${url}','${title}','${artists}')" class="pin-btn text-lg px-1 ${pinned?'pinned':''}">★</button></div></div>`;
    }).join('');
  }catch(e){box.innerHTML='<div class="text-red-400 text-xs">Search failed</div>';}
}
function playFromSearch(id,url,title){if(!url)return;sendCmd({type:'song',id,url,title});document.getElementById('transport').classList.remove('hide');document.getElementById('c-now-title').textContent=title;}
function togglePinFromSearch(id,url,title,artists){if(!url)return;togglePin({id,url,title,artists});searchSaavn();}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&audioUnlocked){
    setPlaybackSession();
    if(keepalive)keepalive.play().catch(()=>{});
    if(currentSong&&!currentSong.paused)currentSong.play().catch(()=>{});
  }
});
</script>
</body>
</html>
