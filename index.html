<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Multimodal Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>tailwind.config = { theme: { extend: { colors: { neutral: { 950: '#0a0a0a', 900: '#171717', 800: '#262626' } } } } }</script>
</head>
<body class="bg-neutral-950 text-neutral-50 font-sans h-screen flex flex-col overflow-hidden">

    <header class="bg-neutral-900 border-b border-neutral-800 p-4 shrink-0 flex items-center gap-3 shadow-md">
        <div class="p-2 bg-indigo-500/10 rounded-xl"><i class="ph ph-robot text-2xl text-indigo-500"></i></div>
        <div>
            <h1 class="text-xl font-bold">Nexus Vercel Bot</h1>
            <p class="text-xs text-green-400">Connected to /api/gemini</p>
        </div>
    </header>

    <main id="chatBox" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 scroll-smooth">
        <div class="flex gap-4 w-full">
            <div class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center shrink-0"><i class="ph ph-robot text-xl text-white"></i></div>
            <div class="bg-neutral-900 border border-neutral-800 rounded-2xl rounded-tl-none px-5 py-4 text-neutral-200">
                <p>Hello! I am ready. Select a mode below and send a prompt!</p>
            </div>
        </div>
    </main>

    <footer class="bg-neutral-900 border-t border-neutral-800 p-4 shrink-0">
        <div class="max-w-4xl mx-auto flex flex-col gap-3">
            <form id="chatForm" class="flex items-end gap-3">
                <div class="relative shrink-0">
                    <select id="modeSelect" class="appearance-none bg-neutral-950 border border-neutral-800 text-neutral-200 text-sm rounded-xl pl-4 pr-10 py-4 focus:outline-none focus:border-indigo-500 h-full">
                        <option value="text">💬 Text</option>
                        <option value="image">🎨 Image</option>
                        <option value="audio">🔊 Audio</option>
                    </select>
                    <i class="ph ph-caret-down absolute right-3 top-1/2 -translate-y-1/2 text-neutral-400 pointer-events-none"></i>
                </div>
                <textarea id="promptInput" rows="1" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-4 text-neutral-100 placeholder:text-neutral-600 focus:outline-none focus:border-indigo-500 resize-none min-h-[54px] max-h-[150px]" placeholder="Type your prompt..."></textarea>
                <button type="submit" id="sendBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white p-4 rounded-xl transition-all disabled:opacity-50 shrink-0">
                    <i id="sendIcon" class="ph-fill ph-paper-plane-tilt text-xl"></i>
                    <i id="sendSpinner" class="ph ph-spinner-gap text-xl animate-spin hidden"></i>
                </button>
            </form>
        </div>
    </footer>

    <script>
        const chatBox = document.getElementById('chatBox');
        const chatForm = document.getElementById('chatForm');
        const promptInput = document.getElementById('promptInput');
        const modeSelect = document.getElementById('modeSelect');
        const sendBtn = document.getElementById('sendBtn');
        const sendIcon = document.getElementById('sendIcon');
        const sendSpinner = document.getElementById('sendSpinner');

        promptInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            sendBtn.disabled = this.value.trim() === '';
        });

        const setLoading = (loading) => {
            promptInput.disabled = modeSelect.disabled = loading;
            sendBtn.disabled = loading || promptInput.value.trim() === '';
            sendIcon.classList.toggle('hidden', loading);
            sendSpinner.classList.toggle('hidden', !loading);
        };

        const addMessage = (role, content, type) => {
            const isUser = role === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `flex gap-4 w-full ${isUser ? 'justify-end' : 'justify-start'}`;

            let avatar = isUser ? `<div class="w-10 h-10 rounded-full bg-neutral-800 flex items-center justify-center shrink-0 border border-neutral-700"><i class="ph ph-user text-xl text-neutral-400"></i></div>` : `<div class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center shrink-0"><i class="ph ph-robot text-xl text-white"></i></div>`;
            
            let innerContent = type === 'text' ? `<p class="whitespace-pre-wrap">${content}</p>` 
                : type === 'image' ? `<img src="${content}" class="rounded-xl max-w-full h-auto max-h-[400px] object-contain" />` 
                : type === 'audio' ? `<audio controls src="${content}" autoplay class="h-10 outline-none rounded-lg"></audio>` 
                : `<div class="flex flex-col gap-1"><span class="font-bold text-red-500">Error:</span><p class="text-red-400 text-sm font-mono whitespace-pre-wrap">${content}</p></div>`;

            let bubbleClass = isUser ? `bg-neutral-800 border border-neutral-700 rounded-2xl rounded-tr-none px-5 py-4` : `bg-neutral-900 border border-neutral-800 rounded-2xl rounded-tl-none px-5 py-4 ${type === 'error' ? 'bg-red-950/20 border-red-900/50' : ''}`;

            wrapper.innerHTML = `${!isUser ? avatar : ''}<div class="${bubbleClass}">${innerContent}</div>${isUser ? avatar : ''}`;
            chatBox.appendChild(wrapper);
            chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
        };

        const submitPrompt = async () => {
            const prompt = promptInput.value.trim();
            const mode = modeSelect.value;
            if (!prompt) return;

            addMessage('user', prompt, 'text');
            promptInput.value = ''; promptInput.style.height = 'auto';
            setLoading(true);

            try {
                // Ensure it targets the absolute root API path
                const res = await fetch('/api/gemini', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt, mode })
                });

                const rawText = await res.text();
                let data;
                try { data = JSON.parse(rawText); } catch (e) { throw new Error(`Vercel Server Error:\n${rawText}`); }

                if (!res.ok) throw new Error(data.error || 'Unknown Server Error');
                
                addMessage('bot', data.result, mode);

            } catch (err) {
                addMessage('bot', err.message, 'error');
            } finally {
                setLoading(false);
                promptInput.focus();
            }
        };

        chatForm.addEventListener('submit', (e) => { e.preventDefault(); submitPrompt(); });
        promptInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitPrompt(); }
        });
    </script>
</body>
</html>
