<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - Optical Physics</title>
    <style>
        :root {
            --bg-color: #030303; /* Deepest almost-black to allow volumetric light to show */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* Apple typography */
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* Container holds everything in perfect alignment */
        .wwdc-scene {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Scaled down slightly from the original to fit "Coming Soon!" on one line */
            font-size: clamp(3rem, 11vw, 14rem);
            font-weight: 200; /* Ultra-thin Apple aesthetic */
            letter-spacing: -0.05em;
            line-height: 1;
            animation: reveal 2.5s cubic-bezier(0.1, 0, 0.1, 1) forwards;
        }

        @keyframes reveal {
            0% { opacity: 0; transform: scale(1.02); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* 1. VOLUMETRIC ATMOSPHERE
         * The massive, soft ambient glow bleeding from the right side into the background room.
         */
        .ambient-scatter {
            position: absolute;
            right: -15%;
            top: 50%;
            transform: translateY(-50%);
            width: 70%;
            height: 200%;
            background: radial-gradient(circle at center, 
                rgba(255, 255, 255, 0.12) 0%, 
                rgba(255, 200, 100, 0.06) 20%, 
                rgba(200, 50, 0, 0.02) 45%, 
                transparent 70%);
            filter: blur(40px);
            z-index: 0;
            pointer-events: none;
        }

        /* 2. MATERIAL BASE LAYER
         * A single seamless gradient mapping the exact grey values of the metallic letters.
         * Adjusted to match the length of "Coming Soon!"
         */
        .base-layer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 1;
            background: linear-gradient(90deg,
                #242426 0%,   /* C, o: Dark grey metal */
                #323235 20%,  /* m, i: Slightly brighter */
                #4b4b50 40%,  /* n, g: Mid-grey transitioning */
                #98989e 55%,  /* S: Light grey reflecting the blast */
                #ffffff 68%,  /* o, o: Pure white blowout */
                #ffffff 100%  /* n, !: Pure white blowout */
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
            white-space: nowrap;
        }

        /* 3. PHYSICS & EMISSION LAYER
         * Overlays perfectly. Holds the 3D bevels, core brightness, and chromatic dispersion.
         */
        .effects-layer {
            position: relative;
            z-index: 2;
            color: transparent; /* Dark letters stay transparent to show base gradient */
            white-space: nowrap;
        }

        .effects-layer span {
            display: inline-block;
        }

        /* SPECULAR HIGHLIGHTS
         * -1px dark shadow + 1px light shadow creates a 3D extruded metallic bevel.
         */
        .metal-1 { text-shadow: -1px -1px 1px rgba(0,0,0,0.9), 1px 1px 1px rgba(255,255,255,0.20); }
        .metal-2 { text-shadow: -1px -1px 1px rgba(0,0,0,0.9), 1px 1px 1.5px rgba(255,255,255,0.25); }
        .metal-3 { text-shadow: -1px -1px 1px rgba(0,0,0,0.9), 1px 1px 2px rgba(255,255,255,0.40); }
        
        /* The letters closest to the light source get blasted by ambient bounce reflection */
        .metal-bounce { text-shadow: -1px -1px 1px rgba(0,0,0,0.5), 2px 0 8px rgba(255,255,255,0.5); }

        /* BLINDING CORE & CHROMATIC DIFFUSION
         * Color is forced to pure white to ensure it acts as the blinding light source.
         */
        .glow-left {
            color: #ffffff;
            text-shadow:
                /* Razor-sharp Cyan lens cut */
                -2px 0 0px rgba(0, 200, 255, 0.9),  
                /* Diffused Blue scatter */
                -6px 0 12px rgba(0, 100, 255, 0.5), 
                
                /* Blinding White Core */
                0 0 15px rgba(255,255,255,1),       
                0 0 35px rgba(255,255,255,0.8);     
        }

        .glow-right {
            color: #ffffff;
            text-shadow:
                /* Razor-sharp Cyan lens cut (Left edge of the letter) */
                -2px 0 0px rgba(0, 200, 255, 0.9),  
                -6px 0 10px rgba(0, 100, 255, 0.4), 
                
                /* Sharp Yellow inner rim (Right edge of the letter) */
                2px 0 0px rgba(255, 230, 0, 1),   
                /* Hot Orange transition */
                6px 0 10px rgba(255, 120, 0, 0.9),  
                /* Red/Orange wide diffusion */
                15px 0 25px rgba(255, 50, 0, 0.7),  
                /* Deep atmospheric red bleed */
                35px 0 60px rgba(200, 0, 0, 0.4),   
                
                /* Blinding White Core */
                0 0 20px rgba(255,255,255,1),       
                0 0 45px rgba(255,255,255,0.8);     
        }
    </style>
</head>
<body>

    <div class="wwdc-scene">
        <!-- 1. Volumetric background glow -->
        <div class="ambient-scatter"></div>
        
        <!-- 2. Seamless metallic gradient base -->
        <div class="base-layer" aria-hidden="true">Coming Soon!</div>
        
        <!-- 3. 3D Bevels, White Core, and Chromatic Dispersion -->
        <!-- Mapped to transition perfectly from dark metal to blinding light -->
        <div class="effects-layer">
            <span class="metal-1">C</span><span class="metal-1">o</span><span class="metal-2">m</span><span class="metal-2">i</span><span class="metal-3">n</span><span class="metal-bounce">g</span><span>&nbsp;</span><span class="metal-bounce">S</span><span class="glow-left">o</span><span class="glow-left">o</span><span class="glow-right">n</span><span class="glow-right">!</span>
        </div>
    </div>

</body>
</html>
