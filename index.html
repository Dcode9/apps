<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D'Verse</title>
    <style>
        :root {
            --bg-color: #030303;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-font-smoothing: antialiased;
            color: #fff;
        }

        /* 1. COMING SOON VIEW */
        #coming-soon-view {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .wwdc-scene {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(3rem, 11vw, 14rem);
            font-weight: 200;
            letter-spacing: -0.05em;
            line-height: 1;
            animation: reveal 2.5s cubic-bezier(0.1, 0, 0.1, 1) forwards;
        }

        @keyframes reveal {
            0% { opacity: 0; transform: scale(1.02); }
            100% { opacity: 1; transform: scale(1); }
        }

        .ambient-scatter {
            position: absolute;
            right: -15%;
            top: 50%;
            transform: translateY(-50%);
            width: 70%;
            height: 200%;
            background: radial-gradient(circle at center, 
                rgba(255, 255, 255, 0.12) 0%, 
                rgba(255, 200, 100, 0.06) 20%, 
                rgba(200, 50, 0, 0.02) 45%, 
                transparent 70%);
            filter: blur(40px);
            z-index: 0;
            pointer-events: none;
        }

        .base-layer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 1;
            background: linear-gradient(90deg,
                #242426 0%,
                #323235 20%,
                #4b4b50 40%,
                #98989e 55%,
                #ffffff 68%,
                #ffffff 100%
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
            white-space: nowrap;
        }

        .effects-layer {
            position: relative;
            z-index: 2;
            color: transparent;
            white-space: nowrap;
        }

        .effects-layer span {
            display: inline-block;
        }

        .metal-1 { text-shadow: -1px -1px 1px rgba(0,0,0,0.9), 1px 1px 1px rgba(255,255,255,0.20); }
        .metal-2 { text-shadow: -1px -1px 1px rgba(0,0,0,0.9), 1px 1px 1.5px rgba(255,255,255,0.25); }
        .metal-3 { text-shadow: -1px -1px 1px rgba(0,0,0,0.9), 1px 1px 2px rgba(255,255,255,0.40); }
        .metal-bounce { text-shadow: -1px -1px 1px rgba(0,0,0,0.5), 2px 0 8px rgba(255,255,255,0.5); }

        .glow-left {
            color: #ffffff;
            text-shadow:
                -2px 0 0px rgba(0, 200, 255, 0.9),  
                -6px 0 12px rgba(0, 100, 255, 0.5), 
                0 0 15px rgba(255,255,255,1),       
                0 0 35px rgba(255,255,255,0.8);     
        }

        .glow-right {
            color: #ffffff;
            text-shadow:
                -2px 0 0px rgba(0, 200, 255, 0.9),  
                -6px 0 10px rgba(0, 100, 255, 0.4), 
                2px 0 0px rgba(255, 230, 0, 1),   
                6px 0 10px rgba(255, 120, 0, 0.9),  
                15px 0 25px rgba(255, 50, 0, 0.7),  
                35px 0 60px rgba(200, 0, 0, 0.4),   
                0 0 20px rgba(255,255,255,1),       
                0 0 45px rgba(255,255,255,0.8);     
        }

        /* 2. AUTH LOADING VIEW (Shown when signing in or returning) */
        #auth-loading-view {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            z-index: 10;
        }

        .spinner {
            width: 52px;
            height: 52px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #00c8ff;
            border-right: 3px solid #9d65ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .auth-title {
            font-size: 1.25rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            color: #f4f4f5;
        }

        .auth-sub {
            font-size: 0.9rem;
            color: #a1a1aa;
        }
    </style>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Default: Optical Physics Coming Soon -->
    <div id="coming-soon-view">
        <div class="wwdc-scene">
            <div class="ambient-scatter"></div>
            <div class="base-layer" aria-hidden="true">Coming Soon!</div>
            <div class="effects-layer">
                <span class="metal-1">C</span><span class="metal-1">o</span><span class="metal-2">m</span><span class="metal-2">i</span><span class="metal-3">n</span><span class="metal-bounce">g</span><span>&nbsp;</span><span class="metal-bounce">S</span><span class="glow-left">o</span><span class="glow-left">o</span><span class="glow-right">n</span><span class="glow-right">!</span>
            </div>
        </div>
    </div>

    <!-- Active Sign-In Loading Screen -->
    <div id="auth-loading-view">
        <div class="spinner"></div>
        <div class="auth-title" id="auth-status-title">Signing in to D'Verse...</div>
        <div class="auth-sub" id="auth-status-sub">Connecting securely with D'Tunes</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://gmwieijbrrztukqpfwkg.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_KX3MYtV84QJJdy9bPDuMEA_V99sLKSE';
        const RETURN_TO_KEY = 'dverse.auth.returnTo';

        const ALLOWED_ORIGINS = new Set([
            'https://tunes.d-verse.in',
            'https://d-verse.in',
            'https://www.d-verse.in',
            'https://ai.d-verse.in',
            'https://webboard.d-verse.in',
            'https://quest.d-verse.in'
        ]);

        function showAuthLoading(title, sub) {
            document.getElementById('coming-soon-view').style.display = 'none';
            const authView = document.getElementById('auth-loading-view');
            authView.style.display = 'flex';
            if (title) document.getElementById('auth-status-title').textContent = title;
            if (sub) document.getElementById('auth-status-sub').textContent = sub;
        }

        function safeReturnUrl(raw) {
            if (!raw) return null;
            try {
                const u = new URL(raw, window.location.origin);
                if (!ALLOWED_ORIGINS.has(u.origin) && !u.origin.includes('d-verse.in')) return null;
                return u.href;
            } catch (e) {
                return null;
            }
        }

        function base64UrlEncode(obj) {
            try {
                const str = JSON.stringify(obj);
                const bytes = new TextEncoder().encode(str);
                let bin = '';
                bytes.forEach(b => bin += String.fromCharCode(b));
                return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            } catch (e) {
                return '';
            }
        }

        async function initAuthFlow() {
            const params = new URLSearchParams(window.location.search);
            const returnToParam = params.get('dverse_return_to');
            const hasAuthHash = window.location.hash && (window.location.hash.includes('access_token=') || window.location.hash.includes('dverse_session='));
            const hasAuthCode = params.has('code');

            // 1. Initial Request from D'Tunes or other app
            if (returnToParam) {
                const validReturn = safeReturnUrl(returnToParam);
                if (validReturn) {
                    sessionStorage.setItem(RETURN_TO_KEY, validReturn);
                }
                showAuthLoading('Redirecting to Google Sign-In...', 'Please wait a moment');
                
                const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                const redirectUri = `${window.location.origin}${window.location.pathname}`;
                
                const { data, error } = await sb.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: redirectUri
                    }
                });

                if (error) {
                    showAuthLoading('Sign-In Error', error.message || 'Could not initialize Google OAuth');
                } else if (data?.url) {
                    window.location.href = data.url;
                }
                return;
            }

            // 2. Returning from Google / Supabase callback with tokens
            if (hasAuthHash || hasAuthCode) {
                showAuthLoading('Authenticating...', 'Passing credentials back to D\'Tunes');
                const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

                let session = null;
                if (hasAuthCode) {
                    const code = params.get('code');
                    const { data } = await sb.auth.exchangeCodeForSession(code);
                    session = data?.session;
                } else {
                    const { data } = await sb.auth.getSession();
                    session = data?.session;
                }

                const savedReturnTo = safeReturnUrl(sessionStorage.getItem(RETURN_TO_KEY)) || 'https://tunes.d-verse.in/';
                sessionStorage.removeItem(RETURN_TO_KEY);

                if (session) {
                    const target = new URL(savedReturnTo);
                    const handoff = {
                        access_token: session.access_token,
                        refresh_token: session.refresh_token,
                        expires_at: session.expires_at,
                        expires_in: session.expires_in,
                        token_type: session.token_type,
                        user: session.user
                    };
                    const encoded = base64UrlEncode(handoff);
                    target.hash = `dverse_session=${encoded}`;
                    window.location.href = target.href;
                } else {
                    // Forward hash directly to D-Tunes
                    const target = new URL(savedReturnTo);
                    target.hash = window.location.hash;
                    window.location.href = target.href;
                }
            }
        }

        // Run auth detection on page load
        initAuthFlow().catch(console.error);
    </script>
</body>
</html>
